<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mes recettes</title>
  <meta name="description" content="Les recettes d'Erick">
  <meta name="theme-color" content="#1F4D3A">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Recettes">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="bandeau">
    <p class="surtitre">Recettes maison</p>
    <h1>Mes recettes</h1>
    <p class="sous-titre">Les recettes d'Erick, à cuisiner et à partager</p>
  </header>

  <div class="recherche">
    <div class="recherche-interne">
      <label for="recherche" class="cache">Rechercher une recette</label>
      <input id="recherche" type="search" placeholder="Rechercher : flan, café, rhum…" autocomplete="off" enterkeyhint="search">
      <div id="filtres" class="filtres" role="group" aria-label="Filtrer par catégorie"></div>
    </div>
  </div>

  <main class="contenu">
    <p id="compteur" class="compteur" aria-live="polite"></p>
    <ul id="cartes" class="cartes"></ul>
    <p id="message" class="message cache"></p>
    <noscript><p class="message">Cette application a besoin de JavaScript pour afficher les recettes.</p></noscript>
  </main>

  <script src="js/commun.js"></script>
  <script src="js/accueil.js"></script>
</body>
</html>
